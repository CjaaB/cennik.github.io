<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="94mm" height="54mm" viewBox="0 0 940 540" role="img" aria-labelledby="title desc">
  <title id="title">Car All Detailing - wizytowka jasna, front</title>
  <desc id="desc">Jasna wizytowka - front.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f5ead0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a570d"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#7a570d"/>
    </linearGradient>
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6d4d11" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="940" height="540" rx="24" fill="url(#paper)"/>
  <rect x="20" y="20" width="900" height="500" rx="18" fill="none" stroke="#c89f25" stroke-opacity="0.45" stroke-width="1.5"/>

  <image xlink:href="logo.png" href="logo.png" x="370" y="48" width="200" height="152" preserveAspectRatio="xMidYMid meet" filter="url(#logoShadow)"/>

  <text x="470" y="228" text-anchor="middle" fill="#2b2110" font-family="Outfit, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="8">CAR ALL</text>
  <text x="470" y="262" text-anchor="middle" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="10">DETAILING</text>

  <line x1="340" y1="282" x2="600" y2="282" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <text x="470" y="318" text-anchor="middle" fill="#9a761d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">Karol Zag&#243;rski</text>

  <text x="470" y="418" text-anchor="middle" fill="#6a5c48" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">Planetenbaan 20  |  Maarssen  |  NL</text>
  <text x="470" y="448" text-anchor="middle" fill="#9a761d" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">cjaab.github.io/cennik.github.io</text>
</svg>
