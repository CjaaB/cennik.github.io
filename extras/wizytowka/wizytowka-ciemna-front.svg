<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="94mm" height="54mm" viewBox="0 0 940 540" role="img" aria-labelledby="title desc">
  <title id="title">Car All Detailing - wizytowka ciemna, front</title>
  <desc id="desc">Ciemna wizytowka - front.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6510"/>
      <stop offset="0.5" stop-color="#e8c96a"/>
      <stop offset="1" stop-color="#8a6510"/>
    </linearGradient>
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tlo i ramka -->
  <rect width="940" height="540" rx="24" fill="url(#bg)"/>
  <rect x="20" y="20" width="900" height="500" rx="18" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Logo - centrum gory, strefa 48-200 -->
  <image xlink:href="logo.png" href="logo.png" x="370" y="48" width="200" height="152" preserveAspectRatio="xMidYMid meet" filter="url(#logoShadow)"/>

  <!-- Nazwa firmy - strefa 212-290 -->
  <text x="470" y="228" text-anchor="middle" fill="url(#gold)" font-family="Outfit, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="8">CAR ALL</text>
  <text x="470" y="262" text-anchor="middle" fill="#f0ead8" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="10">DETAILING</text>

  <!-- Linia -->
  <line x1="340" y1="282" x2="600" y2="282" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Podpis - strefa 290-330 -->
  <text x="470" y="318" text-anchor="middle" fill="#d4af37" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">Karol Zag&#243;rski</text>

  <!-- Adres - strefa 400-460 -->
  <text x="470" y="418" text-anchor="middle" fill="#a8a090" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">Planetenbaan 20  |  Maarssen  |  NL</text>
  <text x="470" y="448" text-anchor="middle" fill="#d4af37" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" opacity="0.8">cjaab.github.io/cennik.github.io</text>
</svg>
