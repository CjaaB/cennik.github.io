<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 2100 2970" role="img" aria-labelledby="title desc">
  <title id="title">Ogloszenie dla sasiadow - car cleaning EN/NL</title>
  <desc id="desc">Przyjazne ogloszenie A4 dla sasiadow w Maarssen - mycie aut, EN i NL.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a570d"/>
      <stop offset="0.45" stop-color="#f1d279"/>
      <stop offset="0.55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#7a570d"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5f430d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="2100" height="2970" fill="#ffffff"/>
  <rect x="88" y="88" width="1924" height="2794" rx="40" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="5"/>
  <rect x="118" y="118" width="1864" height="2734" rx="30" fill="none" stroke="#1f1a13" stroke-opacity="0.05" stroke-width="3"/>

  <g transform="translate(170 170)">
    <rect x="0" y="0" width="1760" height="420" rx="48" fill="#fff8e8" stroke="#d4af37" stroke-opacity="0.32" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1760" height="10" rx="48" fill="url(#gold)"/>
    <circle cx="1580" cy="120" r="110" fill="#d4af37" opacity="0.1"/>
    <circle cx="1660" cy="250" r="64" fill="#15120b" opacity="0.05"/>

    <text x="72" y="88" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="6">FOR NEIGHBOURS / VOOR BUREN</text>
    <text x="72" y="188" fill="#17130d" font-family="Outfit, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-1">Car cleaning</text>
    <text x="72" y="272" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="54" font-weight="900">Auto reiniging | Maarssen</text>
    <path d="M72 318H720" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <text x="72" y="372" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="700">Careful, friendly and local - message me if you are interested.</text>
  </g>

  <g transform="translate(170 680)">
    <rect x="0" y="0" width="840" height="960" rx="40" fill="#fffaf0" stroke="#d4af37" stroke-opacity="0.32" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="840" height="96" rx="40" fill="#15120b"/>
    <text x="56" y="64" fill="#d4af37" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="5">ENGLISH</text>

    <text x="56" y="162" fill="#1f1a13" font-family="Outfit, Arial, sans-serif" font-size="46" font-weight="900">Hi neighbours!</text>
    <text x="56" y="222" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600">I live in this building and I would be happy</text>
    <text x="56" y="264" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600">to carefully clean your car if you want</text>
    <text x="56" y="306" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600">to refresh it.</text>

    <text x="56" y="372" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="900">I can help with:</text>
    <g font-family="Outfit, Arial, sans-serif" font-size="27" fill="#241e16" font-weight="700">
      <circle cx="72" cy="428" r="7" fill="#d4af37"/><text x="96" y="436">exterior wash</text>
      <circle cx="72" cy="488" r="7" fill="#d4af37"/><text x="96" y="496">interior vacuuming and cleaning</text>
      <circle cx="72" cy="548" r="7" fill="#d4af37"/><text x="96" y="556">windows, dashboard and details</text>
      <circle cx="72" cy="608" r="7" fill="#d4af37"/><text x="96" y="616">quick detailer for extra shine</text>
      <circle cx="72" cy="668" r="7" fill="#d4af37"/><text x="96" y="676">light paint protection / fresh-up</text>
    </g>

    <rect x="56" y="720" width="728" height="48" rx="16" fill="#f2e7c7"/>
    <text x="420" y="752" text-anchor="middle" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="900">By appointment only - small local service.</text>
  </g>

  <g transform="translate(1090 680)">
    <rect x="0" y="0" width="840" height="960" rx="40" fill="#f8f4e8" stroke="#d4af37" stroke-opacity="0.32" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="840" height="96" rx="40" fill="#15120b"/>
    <text x="56" y="64" fill="#d4af37" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="5">NEDERLANDS</text>

    <text x="56" y="162" fill="#1f1a13" font-family="Outfit, Arial, sans-serif" font-size="46" font-weight="900">Hoi buren!</text>
    <text x="56" y="222" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600">Ik woon hier in het gebouw en reinig graag</text>
    <text x="56" y="264" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600">uw auto als u deze netjes wilt opfrissen.</text>

    <text x="56" y="372" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="900">Ik kan helpen met:</text>
    <g font-family="Outfit, Arial, sans-serif" font-size="27" fill="#241e16" font-weight="700">
      <circle cx="72" cy="428" r="7" fill="#d4af37"/><text x="96" y="436">buitenkant wassen</text>
      <circle cx="72" cy="488" r="7" fill="#d4af37"/><text x="96" y="496">interieur stofzuigen en reinigen</text>
      <circle cx="72" cy="548" r="7" fill="#d4af37"/><text x="96" y="556">ramen, dashboard en details</text>
      <circle cx="72" cy="608" r="7" fill="#d4af37"/><text x="96" y="616">quick detailer voor extra glans</text>
      <circle cx="72" cy="668" r="7" fill="#d4af37"/><text x="96" y="676">lichte lakbescherming / opfrisbeurt</text>
    </g>

    <rect x="56" y="720" width="728" height="48" rx="16" fill="#efe4c6"/>
    <text x="420" y="752" text-anchor="middle" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="900">Alleen op afspraak - kleine lokale service.</text>
  </g>

  <g transform="translate(170 1780)">
    <rect x="0" y="0" width="1080" height="400" rx="40" fill="#fffaf0" stroke="#d4af37" stroke-opacity="0.32" filter="url(#softShadow)"/>
    <text x="60" y="78" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="4">INTERESTED? / INTERESSE?</text>
    <text x="60" y="148" fill="#17130d" font-family="Outfit, Arial, sans-serif" font-size="42" font-weight="900">Send me a message</text>
    <text x="60" y="200" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="800">Stuur mij gerust een bericht</text>
    <path d="M60 232H980" stroke="#d4af37" stroke-opacity="0.35" stroke-width="3"/>
    <text x="60" y="292" fill="#17130d" font-family="Outfit, Arial, sans-serif" font-size="36" font-weight="900">Karol | WhatsApp +48 731 693 089</text>
    <text x="60" y="346" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="800">Instagram @cjaab99 | Planetenbaan 20, Maarssen</text>
  </g>

  <g transform="translate(1320 1780)">
    <rect x="0" y="0" width="610" height="400" rx="40" fill="#ffffff" stroke="#d4af37" stroke-opacity="0.32" filter="url(#softShadow)"/>
    <text x="305" y="62" text-anchor="middle" fill="#8b650f" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">SCAN WEBSITE</text>
    <rect x="175" y="88" width="260" height="260" rx="22" fill="#fffdf7" stroke="#d4af37" stroke-opacity="0.4"/>
    <image xlink:href="qr-car-all-detailing.svg" href="qr-car-all-detailing.svg" x="195" y="108" width="220" height="220" preserveAspectRatio="xMidYMid meet"/>
    <text x="305" y="372" text-anchor="middle" fill="#514637" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="800">prices, services and booking</text>
  </g>

  <g transform="translate(170 2280)">
    <rect x="0" y="0" width="1760" height="220" rx="40" fill="#15120b"/>
    <rect x="0" y="0" width="1760" height="8" rx="40" fill="url(#gold)"/>
    <text x="880" y="92" text-anchor="middle" fill="#d4af37" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="900">
      Careful car cleaning for neighbours - simple, friendly and local.
    </text>
    <text x="880" y="148" text-anchor="middle" fill="#fff8e8" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="800">
      Nette auto reiniging voor buren - rustig, zorgvuldig en dichtbij.
    </text>
  </g>
</svg>
