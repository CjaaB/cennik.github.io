<svg xmlns="http://www.w3.org/2000/svg" width="94mm" height="54mm" viewBox="0 0 940 540" role="img" aria-labelledby="title desc">
  <title id="title">Car All Detailing - wizytówka jasna, tył</title>
  <desc id="desc">Profesjonalna jasna wizytówka z kontaktem, adresem i kodem QR do strony.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.55" stop-color="#f7efd8"/>
      <stop offset="1" stop-color="#eadbb6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.46" stop-color="#c89f25"/>
      <stop offset="1" stop-color="#72500b"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="85%">
      <stop offset="0" stop-color="#c89f25" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#c89f25" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c89f25" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 22L22 0" stroke="#7a570d" stroke-opacity="0.052" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="940" height="540" rx="34" fill="url(#paper)"/>
  <rect width="940" height="540" rx="34" fill="url(#glow)"/>
  <rect width="940" height="540" rx="34" fill="url(#lines)"/>
  <rect x="28" y="28" width="884" height="484" rx="28" fill="none" stroke="#7a570d" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M66 414H874" stroke="url(#gold)" stroke-width="1.4" opacity="0.55"/>

  <g transform="translate(66 74)">
    <text x="0" y="0" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="4">CAR ALL DETAILING</text>
    <text x="0" y="56" fill="#1f1a13" font-family="Outfit, Arial, sans-serif" font-size="38" font-weight="900">Karol Zagórski</text>
    <text x="0" y="90" fill="#514838" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">Auto detailing • czyszczenie • zabezpieczenie lakieru</text>

    <g transform="translate(0 136)" font-family="Outfit, Arial, sans-serif" font-size="18" fill="#2b2110">
      <rect x="0" y="-26" width="462" height="44" rx="22" fill="#ffffff" fill-opacity="0.58" stroke="#c89f25" stroke-opacity="0.26"/>
      <text x="22" y="2">tel. +48 731 693 089</text>
      <rect x="0" y="30" width="462" height="44" rx="22" fill="#ffffff" fill-opacity="0.45" stroke="#7a570d" stroke-opacity="0.12"/>
      <text x="22" y="58">Instagram: @cjaab99</text>
      <rect x="0" y="86" width="462" height="44" rx="22" fill="#ffffff" fill-opacity="0.45" stroke="#7a570d" stroke-opacity="0.12"/>
      <text x="22" y="114">Planetenbaan 20, Maarssen</text>
    </g>
  </g>

  <g transform="translate(588 72)">
    <rect x="0" y="0" width="286" height="312" rx="30" fill="#fffaf0" stroke="#7a570d" stroke-opacity="0.22"/>
    <rect x="34" y="30" width="218" height="218" rx="20" fill="#ffffff" stroke="#c89f25" stroke-opacity="0.46"/>
    <image href="../qr/qr-car-all-detailing.png" x="52" y="48" width="182" height="182" preserveAspectRatio="xMidYMid meet"/>
    <text x="143" y="278" text-anchor="middle" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="3">SCAN</text>
    <text x="143" y="300" text-anchor="middle" fill="#2b2110" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.4">CENNIK I REZERWACJA</text>
  </g>

  <g transform="translate(66 454)">
    <text x="0" y="0" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="3">WSTĘPNA WYCENA ONLINE</text>
    <text x="302" y="0" fill="#7a570d" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2.2">REZERWACJA PRZEZ WHATSAPP / CALENDLY</text>
  </g>
