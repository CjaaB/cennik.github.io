  <g transform="translate(588 72)">
    <rect x="0" y="0" width="286" height="312" rx="30" fill="#050505" stroke="#d4af37" stroke-opacity="0.34"/>
    <rect x="34" y="30" width="218" height="218" rx="20" fill="#fffdf7" stroke="#d4af37" stroke-opacity="0.5"/>
    <image href="../qr/qr-car-all-detailing.png" x="52" y="48" width="182" height="182" preserveAspectRatio="xMidYMid meet"/>
    <text x="143" y="278" text-anchor="middle" fill="#d4af37" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="3">SCAN</text>
    <text x="143" y="300" text-anchor="middle" fill="#f6efdc" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">CENNIK I REZERWACJA</text>
